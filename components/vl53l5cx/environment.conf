# Empty-environment configuration of the VL53L5CX component.
#
# This file is MANDATORY but may stay empty or fully commented: a file without
# zone lines is ignored and the environment filter then has nothing to apply.
# ESPHome only edits .yaml files, so edit this file with any other editor and
# recompile afterwards.
#
# How to fill it:
#   1. Keep the passage completely free, set 8x8 / 1 Hz, press
#      "Calibrate Empty Environment" and wait for the report in the logs.
#   2. Copy the "#!" lines and the zone lines of the report (without the
#      timestamp/level that ESPHome adds) into this file. Review the values.
#   3. Recompile and flash. Invalid content stops the build with the line number.
#
# Format:
#   #! resolution: 8x8        (required when zones are defined; only 8x8 for now)
#   #! rotation: 0            (required: 0, 90, 180 or 270 = Matrix Rotation used when
#                              the zone numbers were taken; zones are numbered as shown
#                              in the matrices of that rotation)
#   #! max_distance_cm: 400   (optional: Maximum Distance used by the calibration)
#   zone>distance/delta,distance/delta,...   (1 to 4 pairs, centimetres; the range is
#                              distance-delta .. distance+delta; ranges must not overlap)
#   zone>                     (explicitly no reference for that zone)
#
# Example (illustrative values, NOT references):
#   #! resolution: 8x8
#   #! rotation: 0
#   #! max_distance_cm: 400
#   0>150/3,210/5
#   1>95/4,200/6
